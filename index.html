<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROJECT THERMO — P0 renderer proof</title>
<style>
  html, body { margin: 0; height: 100%; background: #050508; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #tag {
    position: fixed; left: 10px; bottom: 8px; z-index: 2;
    font: 10px/1.4 ui-monospace, Menlo, monospace; color: #4a4650;
    user-select: none; pointer-events: none; letter-spacing: 0.06em;
  }
  #mode {
    position: fixed; right: 12px; bottom: 12px; z-index: 2;
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid #3a3540;
    background: rgba(20,16,22,0.7); color: #c9a06a; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    user-select: none; cursor: pointer;
  }
  #err {
    position: fixed; inset: 12px; z-index: 3; display: none;
    font: 12px/1.5 ui-monospace, Menlo, monospace; color: #ff9a8a;

    padding: 12px; border: 1px solid #5a2020; border-radius: 6px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tag">PROJECT THERMO · P4 · hold to warm · tap glass to ripple</div>
<div id="mode" title="touch warms (tap to switch to cool)">♨</div>
<div id="err"></div>
<script>
"use strict";

/* ================= CONFIG =================
   All constants live here (TDD §10, §13). P0 uses the render/optics subset;
   sim constants arrive in P1. Values from the §10 starting table where they
   exist; the rest are P0 render dials, to be moved by calibration (§11).   */
/*CONFIG-BEGIN*/
const CONFIG = {
  timeScale: 1.0,          // §8 — exposed; override with ?ts=N for quick checks

  // ---- vessel / lamp geometry (lamp height = 1.0) ----
  glassRadius: 0.24,
  glassY0: 0.0,
  glassY1: 1.0,
  baseTopR: 0.255, baseBotR: 0.34, baseY0: -0.34, baseY1: 0.005,
  capBotR: 0.255,  capTopR: 0.10,  capY0: 0.995,  capY1: 1.16,
  bulbPos: [0.0, -0.10, 0.0],

  // ---- optics (§10) ----
  sigmaRGB: [0.4, 2.8, 3.2],  // absorption, classic red
  sigmaScale: 14.0,           // maps lamp-unit thickness into sigma exponent
  kE: 0.6,                    // temperature emissive gain
  iorBend: 0.80,              // combined air→glass→liquid single-bend ratio (§9.1.3)
  glassF0: 0.055,
  bulbColor: [1.0, 0.56, 0.20],
  bulbGain: 1.35,
  bulbFalloff: 26.0,
  liquidTint: [1.0, 0.44, 0.16], // dyed-liquid fog color (scaled by glare)
  fogDensity: 1.1,
  underK: 16.0,               // under-light occlusion strength (#17)
  waxAlbedo: [0.62, 0.05, 0.03],
  exposure: 1.25,

  // ---- shape / smin ----
  sminK: 0.055,               // P0: uniform softness (per-blob channel exists)

  // ---- camera ----
  camPos: [0.0, 0.40, 1.75],
  camTarget: [0.0, 0.52, 0.0],
  camFocal: 2.2,
  swayDeg: 0.5, swayHz: 0.021, // §9.1 idle sway

  // ---- render ----
  maxSteps: 80, thicknessSteps: 16, underSteps: 8,
  renderScale: 1.0, maxDPR: 2.0,

  // ---- L1 thermal blob sim (§5) — P1: free blobs, teleport-recycle in pool ----
  sim: {
    dt: 1 / 60,            // fixed sim step, wall-clock decoupled (§8)
    nFree: 8,
    // depth layers (row #26): blobs live on one of three z planes and only
    // merge within their own layer — cross-layer passes ride behind/in front
    layerZ: [-0.095, 0.0, 0.095],
    layerJitter: 0.02,
    gSim: 22,              // global speed master (§5.3); calibrated via harness
    rhoLiq: 1.0, rhoWax0: 1.035, beta: 0.07,  // density crossover at T ≈ 0.483
    cV: 2.0, cH: 3.2,      // anisotropic drag (vertical/horizontal)
    rRef: 0.045,           // reference radius for 1/r thermal scaling
    TMelt: 0.28, meltWidth: 0.08,
    // cooling zones k_zone(y) + ambient profile T_amb(y) (§5.2 step 1)
    // T_amb must sit well below the ρ crossover (0.483) or blobs equilibrate
    // into neutral-buoyancy limbo mid-column instead of committing to a fall
    // cooling must dominate everywhere the bulb doesn't directly reach, or a
    // thermal equilibrium at T≈crossover forms mid-column and blobs limbo there
    kZoneMid: 0.0145, kZoneTop: 0.10,
    zoneMidLo: 0.06, zoneMidHi: 0.18, zoneTopLo: 0.70, zoneTopHi: 0.86,
    TambBottom: 0.65, TambMid: 0.28, TambTop: 0.05,
    // bulb heat is cut off above the pool-stick zone (coil heats wax by
    // contact, §3.4). Invariant: everywhere aloft the net thermal drive is
    // negative — any altitude where heating balances cooling near T≈crossover
    // becomes a capture equilibrium that permanently traps blobs
    kBulb: 0.12, bulbSigma: 0.13, bulbCutLo: 0.03, bulbCutHi: 0.10,
    // detachment size distribution (row #2: size diversity → phase diversity)
    radiusMean: 0.062, radiusSpread: 0.35, rMin: 0.042, rMax: 0.095,
    recycleY: 0.075,       // pool surface: cold sinkers below this are absorbed
    floorY: 0.012, wallMargin: 0.012,
    seedJitter: 0.10,      // ±10% per-blob param noise (row #2)
    // ---- P3: pools with melt accumulator + pendant release (§5.5) ----
    waxTotal: 2.2e-3,      // total wax in the lamp (lamp units³) — invariant
    poolBT0: 0.30, poolTT0: 0.20,     // cold-start pool temperatures
    kPoolHeat: 0.04, poolTHot: 0.95,  // bottom pool heats toward the coil temp
    kTopPoolCool: 0.05,               // top pool cools toward T_amb(top)
    kMeltRate: 5e-5,       // melt accumulator fill per (T - TMelt) per second
    tBulge: 3.0,           // pool bulges visibly before release (#5)
    jDetach: 0.04,         // detachment impulse — "decisive, not sluggish" (§10)
    domeCatch: 0.12, tauDome: 5.0,  // loitering within reach of the dome for
                                    // tauDome seconds → deposit into top pool (#6)
    tAbsorbTop: 1.2,       // blob melts into the top pool over this long
    tAbsorbBottom: 0.8,    // coil breaks the film — bottom melt-in is quicker
    pendantVmin: 2.0e-4,   // top pool volume needed before a pendant drips
    tPendant: 4.0, jPendant: 0.01,       // pendant extrusion time + release nudge
    poolBRef: 1.1e-3, poolTRef: 0.77e-3, // ledger volumes at nominal visual scale
    poolBMinScale: 0.6,    // residual wax film — bottom pool never vanishes
    warmStart: 180,        // pre-roll seconds at load (?cold=1 for true cold start)
    // ---- P2: merge/drainage state machine (§5.4) + volume ledger (#7) ----
    contactEps: 0.01,
    kFilm: 4.0,            // film pressure — soft repulsion while draining
    tauDrain0: 2.5,        // base film-drainage time (s)
    kDeltaT: 6.0,          // drainage penalty per unit |ΔT|
    dTMax: 0.15, vRelMax: 0.03,   // drainage-progress gates
    coilY: 0.12, coilTau: 0.05,   // #25: coil zone → near-instant merge
    tMerge: 0.8,           // slurp duration
    kHard: 0.028, kSoft: 0.085,   // per-blob smin driven by merge readiness
    kLerpRate: 6.0,
    rMaxMerge: 0.105,      // film persists if fusion would exceed this radius
    // ---- P4: interaction (§7) — writes into L1 only ----
    touchSigma: 0.09,      // gaussian heat/cool source, ~1.5 blob radii
    kTouch: 0.14,          // warm/cool touch gain (sign = mode)
    kNudge: 2.0, nudgeCap: 0.05,  // capped, heavily smoothed drag impulse
    kTouchPool: 0.06, kTouchMelt: 1.5e-4,  // cursor over pool: softens + banks melt
    jTap: 0.05, tapSigma: 0.12,   // #24 tap-the-glass radial impulse
    // #9 wobble: damped shape oscillator per blob (replaces the P2 stub)
    wobbleZeta: 0.25, wobbleHz: 1.2, wobbleGain: 0.22,
  },
  tailK: 0.07,             // tail smin softness (necks stay soft vs hard blobs)
  // L2-lite: trailing necks from position history + velocity stretch (#8).
  // Tails follow the blob's real past positions, so neck length tracks sim
  // speed; in P2+ real merge/detach events replace the looping-tail fake.
  tailLagS: [2.3, 4.4],
  tailRadii: [0.60, 0.36],
  stretchMax: 0.6,         // velocity elongation cap (#8)
  stretchVref: 0.011,
  breatheAmp: 0.05,        // #23: nothing is ever static — slow shape breathing
  // bottom pool dome: two pinned spheres, smin does the rest (stand-in for §6.2)
  pool: [
    [0.155, -0.085, -0.075, 0.01],
    [0.150,  0.085, -0.080, -0.02],
  ],
  // top reservoir (#6 P0 fake): cold mass hanging under the dome; movers'
  // paths end inside it so detachment/absorption necks come free from smin
  topPool: [
    [0.135, -0.100, -0.050],
    [0.125,  0.020,  0.060],
    [0.115,  0.105, -0.040],
  ],
  topPoolY: 1.025,
  ceilY: 0.985,            // liquid ceiling clamp — flattens the reservoir top
};
/*CONFIG-END*/

const NBLOB = CONFIG.sim.nFree * (1 + CONFIG.tailRadii.length) +
              CONFIG.pool.length + CONFIG.topPool.length + 2; // +bulge +pendant

const qs = new URLSearchParams(location.search);
if (qs.has("ts")) CONFIG.timeScale = parseFloat(qs.get("ts")) || 1.0;

/* ================= SHADERS ================= */
const VERT = `#version 300 es
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const f = (x) => {
  const s = Number(x).toPrecision(7);
  return s.includes(".") || s.includes("e") ? s : s + ".0";
};
const v3 = (a) => `vec3(${f(a[0])}, ${f(a[1])}, ${f(a[2])})`;

const FRAG = `#version 300 es
precision highp float;

#define NBLOB ${NBLOB}
#define MAX_STEPS ${CONFIG.maxSteps}
#define THICK_STEPS ${CONFIG.thicknessSteps}
#define UNDER_STEPS ${CONFIG.underSteps}

#define R_GLASS ${f(CONFIG.glassRadius)}
#define GLASS_Y0 ${f(CONFIG.glassY0)}
#define GLASS_Y1 ${f(CONFIG.glassY1)}
#define BULB_POS ${v3(CONFIG.bulbPos)}
#define SIGMA (${v3(CONFIG.sigmaRGB)} * ${f(CONFIG.sigmaScale)})
#define K_E ${f(CONFIG.kE)}
#define IOR_BEND ${f(CONFIG.iorBend)}
#define GLASS_F0 ${f(CONFIG.glassF0)}
#define BULB_COLOR ${v3(CONFIG.bulbColor)}
#define BULB_GAIN ${f(CONFIG.bulbGain)}
#define BULB_FALLOFF ${f(CONFIG.bulbFalloff)}
#define LIQUID_TINT ${v3(CONFIG.liquidTint)}
#define FOG_DENSITY ${f(CONFIG.fogDensity)}
#define UNDER_K ${f(CONFIG.underK)}
#define WAX_ALBEDO ${v3(CONFIG.waxAlbedo)}
#define EXPOSURE ${f(CONFIG.exposure)}
#define CAM_FOCAL ${f(CONFIG.camFocal)}

uniform vec2  uRes;
uniform float uTime;
uniform float uShake;   // #24 camera-space vessel shudder
uniform vec4  uBlobA[NBLOB];  // xyz = pos, w = radius
uniform vec4  uBlobB[NBLOB];  // x = T, y = sminK, zw reserved (L2 stretch)

out vec4 outColor;

/* ---------- SDF helpers ---------- */
// interleaved gradient noise: decorrelates march quantization and output dither
float ign(vec2 fc) {
  return fract(52.9829189 * fract(dot(fc, vec2(0.06711056, 0.00583715))));
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdWax(vec3 p) {
  // depth layers (row #26): smin only within a layer; layers meet with a
  // tiny-k smin (reads as film contact, not fusion). uBlobB.w = layer,
  // 3.0 = pools, which merge with every layer.
  vec3 dl = vec3(1e5);
  for (int i = 0; i < NBLOB; i++) {
    // uBlobB[i].z = SIGNED stretch (#8): |s| = elongation, sign = travel
    // direction. Moving blobs are eggs: wide leading face, tapered trailing
    // side, thinned laterally so elongation reads as fluid, not inflation.
    vec3 q = p - uBlobA[i].xyz;
    float sv = uBlobB[i].z;
    float s = max(abs(sv), 0.25);
    float egg = clamp((s - 1.0) * 0.8, 0.0, 0.28);
    float lead = sv >= 0.0 ? 1.0 : -1.0;
    float sy = (q.y * lead > 0.0) ? s * (1.0 + egg) : s * (1.0 - 0.7 * egg);
    q.y /= sy;
    q.xz *= sqrt(s);          // volume compensation: longer = thinner
    float di = (length(q) - uBlobA[i].w) / (1.1 * max(sqrt(s), 1.0));
    float k = uBlobB[i].y;
    float layer = uBlobB[i].w;
    if (layer > 2.5) {
      dl.x = smin(dl.x, di, k); dl.y = smin(dl.y, di, k); dl.z = smin(dl.z, di, k);
    } else if (layer > 1.5) dl.z = smin(dl.z, di, k);
    else if (layer > 0.5) dl.y = smin(dl.y, di, k);
    else dl.x = smin(dl.x, di, k);
  }
  float d = smin(smin(dl.x, dl.y, 0.014), dl.z, 0.014);
  // pool floor + liquid ceiling: wax stays inside the fluid column
  d = max(d, GLASS_Y0 - 0.02 - p.y);
  d = max(d, p.y - ${f(CONFIG.ceilY)});
  return d;
}

// temperature of nearest wax, contribution-weighted (drives emissive, #17)
float waxT(vec3 p) {
  float wsum = 1e-5, tsum = 0.0;
  for (int i = 0; i < NBLOB; i++) {
    float di = length(p - uBlobA[i].xyz) - uBlobA[i].w;
    float w = exp(-di * 18.0);
    wsum += w; tsum += w * uBlobB[i].x;
  }
  return tsum / wsum;
}

vec3 waxNormal(vec3 p) {
  const vec2 e = vec2(0.0015, -0.0015);
  return normalize(e.xyy * sdWax(p + e.xyy) + e.yyx * sdWax(p + e.yyx) +
                   e.yxy * sdWax(p + e.yxy) + e.xxx * sdWax(p + e.xxx));
}

/* ---------- metal base & cap ---------- */
float sdCappedCone(vec3 p, vec3 a, vec3 b, float ra, float rb) {
  float rba = rb - ra;
  float baba = dot(b - a, b - a);
  float papa = dot(p - a, p - a);
  float paba = dot(p - a, b - a) / baba;
  float x = sqrt(max(papa - paba * paba * baba, 0.0));
  float cax = max(0.0, x - ((paba < 0.5) ? ra : rb));
  float cay = abs(paba - 0.5) - 0.5;
  float k = rba * rba + baba;
  float fq = clamp((rba * (x - ra) + paba * baba) / k, 0.0, 1.0);
  float cbx = x - ra - fq * rba;
  float cby = paba - fq;
  float s = (cbx < 0.0 && cay < 0.0) ? -1.0 : 1.0;
  return s * sqrt(min(cax * cax + cay * cay * baba, cbx * cbx + cby * cby * baba));
}

float sdMetal(vec3 p) {
  float base = sdCappedCone(p, vec3(0.0, ${f(CONFIG.baseY0)}, 0.0), vec3(0.0, ${f(CONFIG.baseY1)}, 0.0),
                            ${f(CONFIG.baseBotR)}, ${f(CONFIG.baseTopR)});
  float cap  = sdCappedCone(p, vec3(0.0, ${f(CONFIG.capY0)}, 0.0), vec3(0.0, ${f(CONFIG.capY1)}, 0.0),
                            ${f(CONFIG.capBotR)}, ${f(CONFIG.capTopR)});
  return min(base, cap);
}

vec3 metalNormal(vec3 p) {
  const vec2 e = vec2(0.002, -0.002);
  return normalize(e.xyy * sdMetal(p + e.xyy) + e.yyx * sdMetal(p + e.yyx) +
                   e.yxy * sdMetal(p + e.yxy) + e.xxx * sdMetal(p + e.xxx));
}

/* ---------- analytic vessel intersection ---------- */
// segment of ray inside the glass cylinder band; hit if result.x < result.y
vec2 vesselSpan(vec3 ro, vec3 rd) {
  float a = dot(rd.xz, rd.xz);
  if (a < 1e-7) a = 1e-7;
  float b = 2.0 * dot(ro.xz, rd.xz);
  float c = dot(ro.xz, ro.xz) - R_GLASS * R_GLASS;
  float h = b * b - 4.0 * a * c;
  if (h < 0.0) return vec2(1.0, -1.0);
  h = sqrt(h);
  float t0 = (-b - h) / (2.0 * a);
  float t1 = (-b + h) / (2.0 * a);
  float ty0 = (GLASS_Y0 - ro.y) / rd.y;
  float ty1 = (GLASS_Y1 - ro.y) / rd.y;
  float tyMin = min(ty0, ty1), tyMax = max(ty0, ty1);
  return vec2(max(t0, tyMin), min(t1, tyMax));
}

/* ---------- environment / background ---------- */
vec3 envColor(vec3 rd) {
  // fake 2-band room: warm dark below, cool dim above + faint window streak
  vec3 c = mix(vec3(0.035, 0.016, 0.010), vec3(0.010, 0.013, 0.022),
               smoothstep(-0.3, 0.7, rd.y));
  float streak = exp(-rd.x * rd.x * 40.0) * smoothstep(-0.1, 0.8, rd.y);
  c += vec3(0.05, 0.06, 0.08) * streak;
  return c;
}

vec3 background(vec3 rd) {
  vec3 c = mix(vec3(0.014, 0.011, 0.018), vec3(0.002, 0.002, 0.005),
               smoothstep(-0.6, 0.9, rd.y));
  // warm floor spill from the lamp
  c += vec3(0.030, 0.012, 0.004) * exp(-(rd.y + 0.45) * (rd.y + 0.45) * 22.0);
  return c;
}

/* ---------- liquid: fog + bulb glare along a segment (#17, #20) ---------- */
vec3 liquidRadiance(vec3 p0, vec3 rd, float len) {
  vec3 q = BULB_POS - p0;
  float tc = clamp(dot(q, rd), 0.0, len);
  float dc = length(q - rd * tc);
  float glare = BULB_GAIN / (1.0 + dc * dc * BULB_FALLOFF);
  float amt = 1.0 - exp(-len * FOG_DENSITY);
  return LIQUID_TINT * glare * amt * 0.28;
}

/* ---------- lights ---------- */
const vec3 KEY_DIR = normalize(vec3(0.55, 0.9, 0.8));
const vec3 KEY_COL = vec3(0.20, 0.22, 0.27);

vec3 shadeMetal(vec3 p, vec3 rd) {
  vec3 n = metalNormal(p);
  vec3 alb = vec3(0.045, 0.042, 0.048);
  vec3 col = alb * (0.25 + 0.75 * max(n.y, 0.0)) * vec3(0.12, 0.12, 0.16);
  // key light
  float diff = max(dot(n, KEY_DIR), 0.0);
  vec3 hv = normalize(KEY_DIR - rd);
  col += KEY_COL * (alb * diff + 0.30 * pow(max(dot(n, hv), 0.0), 40.0));
  // bulb leak: warm ring where base meets glass, dim wash on cap underside
  vec3 toBulb = BULB_POS - p;
  float dB = length(toBulb);
  float leak = exp(-abs(p.y - ${f(CONFIG.baseY1)}) * 14.0) * (p.y < 0.5 ? 1.0 : 0.0);
  col += BULB_COLOR * 0.35 * leak / (1.0 + dB * dB * 8.0);
  float capGlow = (p.y > 0.5) ? exp(-(p.y - ${f(CONFIG.capY0)}) * 9.0) : 0.0;
  col += vec3(0.35, 0.10, 0.05) * 0.10 * capGlow * max(-n.y, 0.0);
  return col;
}

/* ---------- main ---------- */
void main() {
  vec2 uv = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;

  // camera with idle sway (§9.1)
  float sway = ${f(CONFIG.swayDeg * Math.PI / 180)} * sin(uTime * ${f(CONFIG.swayHz * 2 * Math.PI)});
  float cs = cos(sway), sn = sin(sway);
  vec3 ro = ${v3(CONFIG.camPos)};
  ro.x += uShake;
  ro.xz = mat2(cs, -sn, sn, cs) * ro.xz;
  vec3 ta = ${v3(CONFIG.camTarget)};
  vec3 fw = normalize(ta - ro);
  vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(fw * CAM_FOCAL + rt * uv.x + up * uv.y);

  vec3 col;

  // metal base/cap: short march (they are convex and cheap)
  float tMetal = -1.0;
  {
    float t = 0.5;
    for (int i = 0; i < 48; i++) {
      vec3 p = ro + rd * t;
      float d = sdMetal(p);
      if (d < 0.0015) { tMetal = t; break; }
      t += d;
      if (t > 4.0) break;
    }
  }

  vec2 span = vesselSpan(ro, rd);
  bool hitGlass = span.x < span.y && span.y > 0.0 && (tMetal < 0.0 || span.x < tMetal);

  if (hitGlass) {
    float tG = max(span.x, 0.0);
    vec3 pG = ro + rd * tG;
    vec3 nG = normalize(vec3(pG.x, 0.0, pG.z));

    // single combined refraction bend at entry (§9.1.3)
    vec3 rd2 = refract(rd, nG, IOR_BEND);
    if (dot(rd2, rd2) < 0.5) rd2 = rd;

    // interior segment for the bent ray
    vec3 roIn = pG + rd2 * 0.002;
    vec2 spanIn = vesselSpan(roIn, rd2);
    float tMax = max(spanIn.y, 0.0);

    // ---- raymarch wax (§9.1.4) ----
    float jit = ign(gl_FragCoord.xy);
    float t = 0.0;
    float hit = -1.0;
    for (int i = 0; i < MAX_STEPS; i++) {
      vec3 p = roIn + rd2 * t;
      float d = sdWax(p);
      if (d < 7e-4 * (1.0 + 0.6 * t)) { hit = t; break; }
      t += d * 0.9;
      if (t > tMax) break;
    }

    if (hit >= 0.0) {
      vec3 ph = roIn + rd2 * hit;
      vec3 n = waxNormal(ph);
      float Th = waxT(ph);

      // a. thickness march to exit (§9.1.5a) — jittered start + finer floor
      // so Beer-Lambert doesn't terrace into contour bands in blend regions
      float th = 0.003 + jit * 0.008;
      for (int i = 0; i < THICK_STEPS; i++) {
        vec3 p = ph + rd2 * th;
        float s = sdWax(p);
        if (s > 0.003) break;
        th += max(-s, 0.008);
      }

      // b. Beer–Lambert transmittance (#16)
      vec3 trans = exp(-SIGMA * th);

      // light arriving from behind the wax = liquid glare there
      vec3 pExit = ph + rd2 * th;
      float remLen = max(tMax - (hit + th), 0.0);
      vec3 behind = liquidRadiance(pExit, rd2, remLen) +
                    BULB_COLOR * BULB_GAIN * 0.16 /
                    (1.0 + dot(pExit - BULB_POS, pExit - BULB_POS) * BULB_FALLOFF);

      // c. under-light: short march toward bulb (#17)
      vec3 dirB = normalize(BULB_POS - ph);
      float occ = 0.0;
      for (int i = 0; i < UNDER_STEPS; i++) {
        vec3 p = ph + dirB * (float(i) + jit) * 0.035;
        occ += max(-sdWax(p), 0.0);
      }
      float dBulb = length(BULB_POS - ph);
      float A = exp(-occ * UNDER_K) / (1.0 + dBulb * dBulb * 2.4);
      float fscat = 0.30 + 0.70 * pow(max(dot(rd2, dirB), 0.0), 2.0);
      vec3 under = BULB_COLOR * A * (fscat + K_E * Th) * 1.1;

      // translucent rim: light piped through thin silhouette wax
      vec3 rimGlow = BULB_COLOR * A * pow(1.0 - abs(dot(n, rd2)), 2.5) * (0.5 + 0.8 * Th);

      // body: absorbed fraction re-emits albedo lit from below + faint ambient
      vec3 body = (1.0 - trans) * WAX_ALBEDO * (under * 2.2 + vec3(0.020, 0.016, 0.022));

      // d. specular, Fresnel-weighted (#19)
      float fres = pow(1.0 - max(dot(n, -rd2), 0.0), 5.0);
      vec3 hB = normalize(dirB - rd2);
      vec3 hK = normalize(KEY_DIR - rd2);
      vec3 spec = BULB_COLOR * pow(max(dot(n, hB), 0.0), 48.0) * 0.7
                + KEY_COL * pow(max(dot(n, hK), 0.0), 64.0) * 2.2;
      spec *= (0.06 + 0.94 * fres);

      // fog between glass and wax surface
      vec3 nearFog = liquidRadiance(roIn, rd2, hit);

      col = trans * behind * 3.2 + body + under + rimGlow + spec + nearFog;
    } else {
      // miss: pure liquid path (#12 motes are P5; #20 tint fog)
      float len = tMax;
      col = liquidRadiance(roIn, rd2, len);
      // bulb glare disc seen through the liquid bottom
      vec3 q = BULB_POS - roIn;
      float tc = clamp(dot(q, rd2), 0.0, len);
      float dc = length(q - rd2 * tc);
      col += BULB_COLOR * BULB_GAIN * 0.10 / (0.004 + dc * dc * 20.0) * 0.02;
      // ray leaves the vessel: dim background behind, or metal behind glass
      vec3 pOut = roIn + rd2 * len;
      col += 0.85 * background(rd2) * (1.0 - smoothstep(0.0, 0.25, 0.0));
      if (pOut.y < GLASS_Y0 + 0.02) col += vec3(0.05, 0.02, 0.01);
    }

    // glass Fresnel: env reflection mix (§9.1.3, #18)
    float fresG = GLASS_F0 + (1.0 - GLASS_F0) * pow(1.0 - max(dot(-rd, nG), 0.0), 5.0);
    col = mix(col, envColor(reflect(rd, nG)) * 2.0, clamp(fresG, 0.0, 1.0));
    // bright rim where view grazes the cylinder
    float rim = pow(1.0 - max(dot(-rd, nG), 0.0), 12.0);
    col += vec3(0.5, 0.45, 0.42) * rim * 0.10;
  } else if (tMetal > 0.0) {
    col = shadeMetal(ro + rd * tMetal, rd);
  } else {
    col = background(rd);
    // halo around the vessel silhouette (cheap bloom stand-in until P5 #21)
    vec2 spanH = vesselSpan(ro, rd);
    float missBy = spanH.x - spanH.y;
    if (missBy > 0.0) col += vec3(0.10, 0.035, 0.012) * exp(-missBy * 30.0) * 0.5;
  }

  // tonemap + gamma
  col *= EXPOSURE;
  col = clamp((col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14), 0.0, 1.0);
  col = pow(col, vec3(1.0 / 2.2));

  // vignette
  float vig = 1.0 - 0.28 * dot(uv * 0.6, uv * 0.6);
  col *= vig;

  // dither (#22) — IGN (blue-noise texture in P5 if banding still shows)
  col += (ign(gl_FragCoord.xy) - 0.5) * (2.0 / 255.0);

  outColor = vec4(col, 1.0);
}`;

/* ================= HOST ================= */
const canvas = document.getElementById("c");
const errBox = document.getElementById("err");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false });

function fail(msg) {
  errBox.style.display = "block";
  errBox.textContent = msg;
  throw new Error(msg);
}
if (!gl) fail("WebGL2 not available on this device/browser.");

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    fail("Shader compile error:\n" + gl.getShaderInfoLog(s));
  }
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  fail("Program link error:\n" + gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

const uRes = gl.getUniformLocation(prog, "uRes");
const uTime = gl.getUniformLocation(prog, "uTime");
const uShake = gl.getUniformLocation(prog, "uShake");
const uBlobA = gl.getUniformLocation(prog, "uBlobA");
const uBlobB = gl.getUniformLocation(prog, "uBlobB");

const blobA = new Float32Array(NBLOB * 4);
const blobB = new Float32Array(NBLOB * 4);

/*SIM-BEGIN*/
/* L1 — thermal blob simulation (§5). P1 scope: free blobs only; a blob that
   sinks cold into the bottom pool teleport-recycles as a fresh spawn hidden
   inside the pool mass. No merging, no volume ledger (P2), no real pools (P3). */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sstep = (a, b, x) => {
  const u = clamp((x - a) / (b - a), 0, 1);
  return u * u * (3 - 2 * u);
};

// ambient liquid temperature falls with height (§3.3)
function TambAt(y, S) {
  if (y < 0.3) return S.TambBottom + (S.TambMid - S.TambBottom) * (y / 0.3);
  return S.TambMid + (S.TambTop - S.TambMid) * clamp((y - 0.3) / 0.7, 0, 1);
}
// cooling-rate zones: none at the bulb, mild mid-column, strong at top
function kZoneAt(y, S) {
  return S.kZoneMid * sstep(S.zoneMidLo, S.zoneMidHi, y) +
         (S.kZoneTop - S.kZoneMid) * sstep(S.zoneTopLo, S.zoneTopHi, y);
}

function spawnInto(b, C, rng, y0) {
  const S = C.sim;
  b.r = clamp(S.radiusMean * Math.exp((rng() * 2 - 1) * S.radiusSpread), S.rMin, S.rMax);
  b.layer = Math.floor(rng() * S.layerZ.length);
  b.z = S.layerZ[b.layer] + (rng() * 2 - 1) * S.layerJitter;
  const lim = C.glassRadius - b.r - S.wallMargin;
  b.xMax = Math.sqrt(Math.max(lim * lim - b.z * b.z, 1e-4));
  b.x = (rng() * 2 - 1) * b.xMax * 0.8;
  b.y = y0;
  b.vx = 0; b.vy = 0;
  b.aloft = false;  // set once the blob has genuinely flown; gates absorption
  b.T = 0.5;        // caller overrides: detached blobs are born at pool T
  b.seed = 1 + (rng() * 2 - 1) * S.seedJitter;
  b.hist = [];            // position history for L2 tails — reset on spawn
  // §5.4 state machine fields
  b.active = true;
  b.state = 0;            // 0 FREE | 1 CONTACT | 2 MERGING
  b.partner = -1;
  b.drainTimer = 0; b.mReady = 0; b.mergeT = 0;
  b.kNow = S.kHard;
  b.w = 0; b.wdot = 0;    // #9 shape oscillator state (stretch perturbation)
  return b;
}

function setRadius(b, r, C) {
  const S = C.sim;
  b.r = r;
  const lim = C.glassRadius - r - S.wallMargin;
  b.xMax = Math.sqrt(Math.max(lim * lim - b.z * b.z, 4e-4));
  b.x = clamp(b.x, -b.xMax, b.xMax);
}

function createSim(C, seed) {
  const rng = mulberry32(seed);
  const blobs = [];
  // §5.5 self-priming cold start: ALL wax begins in the bottom pool ledger.
  // The melt model produces the first detachment; nothing is scattered.
  for (let i = 0; i < C.sim.nFree; i++) {
    const b = spawnInto({}, C, rng, C.sim.floorY + 0.005);
    b.active = false;
    blobs.push(b);
  }
  return {
    blobs, rng, t: 0,
    poolB: { V: C.sim.waxTotal, T: C.sim.poolBT0, meltAccum: 0,
             bulge: 0, bulgeX: 0, bulgeZ: 0, bulgeLayer: 1, nextR: 0 },
    poolT: { V: 0, T: C.sim.poolTT0,
             pendant: 0, pendantX: 0, pendantZ: 0, pendantLayer: 1, nextR: 0 },
    // §7 interaction state: host writes it, sim reads it — L1 only
    touch: { active: false, x: 0, y: 0, mode: 1, strength: 1, vx: 0, vy: 0 },
    ev: { merges: [], absorbsTop: 0, absorbsBottom: 0, detaches: 0, pendants: 0 },
  };
}

// #24 tap-the-glass: radial impulse to nearby blobs, excites #9 oscillators
function applyTap(sim, C, x, y) {
  const S = C.sim;
  for (const b of sim.blobs) {
    if (!b.active) continue;
    const dx = b.x - x, dy = b.y - y;
    const d = Math.hypot(dx, dy) + 1e-5;
    const g = Math.exp(-(d * d) / (2 * S.tapSigma * S.tapSigma));
    b.vx += (dx / d) * S.jTap * g;
    b.vy += (dy / d) * S.jTap * g;
    b.wdot += 6 * S.jTap * g * (2 * Math.PI * S.wobbleHz);
  }
}

function sampleR(sim, S, capV) {
  let r = clamp(S.radiusMean * Math.exp((sim.rng() * 2 - 1) * S.radiusSpread),
                S.rMin, S.rMax);
  return Math.min(r, Math.cbrt(Math.max(capV, 0) * 0.8));
}

function simStep(sim, C) {
  const S = C.sim, dt = S.dt;
  for (const b of sim.blobs) {
    if (!b.active) continue;
    // 1. thermal: dT/dt = (k_zone·(T_amb − T) + k_bulb·bulbGain) · (r_ref/r)
    const dx = b.x - C.bulbPos[0], dy = b.y - C.bulbPos[1];
    const gB = Math.exp(-(dx * dx + dy * dy) / (2 * S.bulbSigma * S.bulbSigma)) *
               (1 - sstep(S.bulbCutLo, S.bulbCutHi, b.y));
    const dT = (kZoneAt(b.y, S) * (TambAt(b.y, S) - b.T) + S.kBulb * gB) *
               (S.rRef / b.r) * b.seed;
    b.T = clamp(b.T + dT * dt, 0, 1);
    // §7 warm/cool touch: gaussian heat source + capped, smoothed nudge.
    // Heat is the verb — no positional grab, ever.
    const TC = sim.touch;
    if (TC.active) {
      const tdx = b.x - TC.x, tdy = b.y - TC.y;
      const gT = Math.exp(-(tdx * tdx + tdy * tdy) / (2 * S.touchSigma * S.touchSigma));
      b.T = clamp(b.T + S.kTouch * TC.mode * TC.strength * gT * (S.rRef / b.r) * dt, 0, 1);
      b.vx += clamp(TC.vx, -S.nudgeCap, S.nudgeCap) * gT * S.kNudge * dt;
      b.vy += clamp(TC.vy, -S.nudgeCap, S.nudgeCap) * gT * S.kNudge * dt;
    }
    b.melt = sstep(S.TMelt - S.meltWidth, S.TMelt + S.meltWidth, b.T);

    // 2. forces: buoyancy from ρ(T) crossover (§5.3), anisotropic drag
    const rhoWax = S.rhoWax0 * (1 - S.beta * b.T);
    let ab = S.gSim * b.seed * (S.rhoLiq - rhoWax) / rhoWax;
    if (ab > 0) ab *= Math.sqrt(b.melt);  // melt gates rising, not sinking
    const ay = ab - (S.cV * b.vy) / b.r;
    const ax = -(S.cH * b.vx) / b.r;

    // 3. semi-implicit Euler (§5.2 step 3); px/py kept for render interpolation
    b.px = b.x; b.py = b.y;
    b.vy += ay * dt; b.vx += ax * dt;
    b.y += b.vy * dt; b.x += b.vx * dt;

    // 4. walls: kill normal velocity, damp tangential (§5.2)
    if (b.x > b.xMax) { b.x = b.xMax; b.vx = 0; b.vy *= 0.98; }
    if (b.x < -b.xMax) { b.x = -b.xMax; b.vx = 0; b.vy *= 0.98; }
    const yTop = C.ceilY - 0.03 - b.r * 0.55;  // presses into the top reservoir
    if (b.y > yTop) { b.y = yTop; if (b.vy > 0) b.vy = 0; b.vx *= 0.98; }
    if (b.y < S.floorY) { b.y = S.floorY; if (b.vy < 0) b.vy = 0; b.vx *= 0.98; }

    if (b.y > 0.35) b.aloft = true;

    // smin softness chases merge readiness (§5.4: dimple → slurp)
    const kTarget = S.kHard + (S.kSoft - S.kHard) * b.mReady;
    b.kNow += (kTarget - b.kNow) * Math.min(1, dt * S.kLerpRate);
    // #9 shape oscillator: critically-under-damped ring-down (ζ, f from §10)
    const om = 2 * Math.PI * S.wobbleHz;
    b.wdot += (-2 * S.wobbleZeta * om * b.wdot - om * om * b.w) * dt;
    b.w = clamp(b.w + b.wdot * dt, -0.6, 0.6);
  }

  contactPass(sim, C);
  mergePass(sim, C);
  poolPass(sim, C);

  for (const b of sim.blobs) {
    if (!b.active) continue;
    b.hist.push(b.x, b.y);
    const maxHist = Math.ceil(4.5 / dt) * 2;
    if (b.hist.length > maxHist) b.hist.splice(0, b.hist.length - maxHist);
  }
  sim.t += dt;
}

/* §5.4 contact state machine: FREE → CONTACT (film pressure + drainage
   timer) → MERGING. Same-layer only — cross-layer passes ride (#26). */
function contactPass(sim, C) {
  const S = C.sim, dt = S.dt, bl = sim.blobs;
  for (const b of bl) if (b.active && b.state === 1) b.state = 0; // re-derive
  for (let i = 0; i < bl.length; i++) {
    const a = bl[i];
    // absorbing blobs are mid-transfer into a pool ledger: merging one would
    // double-count its volume (fusion + stale absorb record). Skip them.
    if (!a.active || a.state !== 0 || a.absorbing) continue;
    for (let j = i + 1; j < bl.length; j++) {
      const c = bl[j];
      if (!c.active || c.state !== 0 || c.absorbing || a.layer !== c.layer) continue;
      const dx = c.x - a.x, dy = c.y - a.y, dz = c.z - a.z;
      const dist = Math.hypot(dx, dy, dz);
      if (dist >= a.r + c.r + S.contactEps) continue;

      a.state = c.state = 1;
      a.partner = j; c.partner = i;

      // film pressure: soft repulsion while the film drains
      const overlap = a.r + c.r - dist;
      if (overlap > 0 && dist > 1e-6) {
        const nx = dx / dist, ny = dy / dist;
        a.vx -= (nx * S.kFilm * overlap / a.r) * dt;
        a.vy -= (ny * S.kFilm * overlap / a.r) * dt;
        c.vx += (nx * S.kFilm * overlap / c.r) * dt;
        c.vy += (ny * S.kFilm * overlap / c.r) * dt;
      }

      // drainage timer, gated by |ΔT| and relative velocity
      const dT = Math.abs(a.T - c.T);
      const vRel = Math.hypot(a.vx - c.vx, a.vy - c.vy);
      const inCoil = Math.min(a.y, c.y) < S.coilY;   // #25
      const tau = inCoil ? S.coilTau : S.tauDrain0 * (1 + S.kDeltaT * dT);
      let timer = Math.max(a.drainTimer, c.drainTimer);
      if (dT < S.dTMax && vRel < S.vRelMax) timer += dt;
      else timer *= Math.pow(0.95, dt * 60);
      a.drainTimer = c.drainTimer = timer;
      const m = Math.min(timer / tau, 1);
      a.mReady = c.mReady = m;

      const rNew = Math.cbrt(a.r ** 3 + c.r ** 3);
      if (m >= 1 && rNew <= S.rMaxMerge) {
        a.state = c.state = 2;
        a.mergeT = c.mergeT = S.tMerge;
        sim.ev.merges.push({ t: sim.t, delay: timer, coil: inCoil, r: rNew });
      }
      break; // one partner max (§5.1 contactPartner)
    }
  }
  for (const b of bl) {
    if (b.active && b.state === 0) {
      b.partner = -1;
      b.drainTimer *= Math.pow(0.95, dt * 60);
      b.mReady = Math.max(0, b.mReady - dt * 1.5);
    }
  }
}

function mergePass(sim, C) {
  const S = C.sim, dt = S.dt, bl = sim.blobs;
  for (let i = 0; i < bl.length; i++) {
    const a = bl[i];
    if (!a.active || a.state !== 2 || a.partner < i) continue;
    const c = bl[a.partner];
    if (!c || !c.active || c.state !== 2) { a.state = 0; a.partner = -1; continue; }
    a.mergeT -= dt; c.mergeT = a.mergeT;
    const w1 = a.r ** 3, w2 = c.r ** 3, W = w1 + w2;
    const cx = (a.x * w1 + c.x * w2) / W, cy = (a.y * w1 + c.y * w2) / W;
    // slurp: both bodies converge on the volume-weighted center over t_merge
    const lam = Math.min(1, dt / Math.max(a.mergeT, dt));
    a.x += (cx - a.x) * lam; a.y += (cy - a.y) * lam;
    c.x += (cx - c.x) * lam; c.y += (cy - c.y) * lam;
    if (a.mergeT <= 0) {
      const surv = a.r >= c.r ? a : c, gone = surv === a ? c : a;
      surv.x = cx; surv.y = cy;
      surv.vx = (a.vx * w1 + c.vx * w2) / W;
      surv.vy = (a.vy * w1 + c.vy * w2) / W;
      surv.T = (a.T * w1 + c.T * w2) / W;
      setRadius(surv, Math.cbrt(W), C);       // #7: volume-exact
      surv.state = 0; surv.partner = -1; surv.drainTimer = 0;
      surv.mReady = 1;                        // k relaxes hard smoothly
      surv.wdot += 0.5 * (2 * Math.PI * S.wobbleHz);  // #9: merge excites wobble
      gone.active = false; gone.state = 0; gone.partner = -1;
    }
  }
}

/* §5.5 pools: melt-accumulator detachment (bottom, #5), dome absorption and
   pendant drips (top, #6), both against exact volume ledgers (#7). */
function poolPass(sim, C) {
  const S = C.sim, dt = S.dt, bl = sim.blobs;
  const PB = sim.poolB, PT = sim.poolT;

  // ---- bottom pool: coil heats it; melt accumulates; bulge then release ----
  PB.T = clamp(PB.T + S.kPoolHeat * (S.poolTHot - PB.T) * dt, 0, 1);
  // §7 warm touch over the pool: softens it and banks melt faster (P4 gate:
  // heat-cursor over the pool detaches a blob within ~4 s)
  let touchG = 0;
  const TC = sim.touch;
  if (TC.active && TC.mode > 0 && TC.y < 0.18) {
    touchG = TC.strength * Math.exp(-(TC.x * TC.x + (TC.y - 0.04) ** 2) /
                                    (2 * S.touchSigma * S.touchSigma * 4));
    PB.T = clamp(PB.T + S.kTouchPool * touchG * dt, 0, 1);
  }
  PB.meltAccum = Math.min(PB.meltAccum +
    (S.kMeltRate * Math.max(PB.T - S.TMelt, 0) + S.kTouchMelt * touchG) * dt,
    8e-4);  // capped: waiting must not bank a burst
  if (PB.nextR === 0) {
    const r = sampleR(sim, S, PB.V);
    if (r >= S.rMin) {
      PB.nextR = r;
      PB.bulgeX = (sim.rng() * 2 - 1) * 0.10;
      PB.bulgeLayer = Math.floor(sim.rng() * S.layerZ.length);
      PB.bulgeZ = S.layerZ[PB.bulgeLayer] + (sim.rng() * 2 - 1) * S.layerJitter;
    }
  }
  const need = PB.nextR > 0 ? PB.nextR ** 3 : Infinity;
  if (PB.nextR > 0 && PB.meltAccum >= need && PB.V >= need) {
    // pool swells first (#5); a warm touch hurries the bulge along
    PB.bulge = Math.min(PB.bulge + (dt / S.tBulge) * (1 + 2.5 * touchG), 1);
    if (PB.bulge >= 1) {
      const slot = bl.find(b => !b.active);
      if (slot) {
        // spawn exactly where the bulge sphere ended — seamless handoff
        spawnInto(slot, C, sim.rng, S.floorY + 0.01 + PB.nextR * 0.8);
        slot.layer = PB.bulgeLayer; slot.z = PB.bulgeZ;
        setRadius(slot, PB.nextR, C);
        slot.x = clamp(PB.bulgeX, -slot.xMax, slot.xMax);
        slot.T = PB.T; slot.melt = 1;
        slot.vy = S.jDetach;                            // decisive kick (§10)
        slot.wdot += 0.35 * (2 * Math.PI * S.wobbleHz);
        PB.V -= need; PB.meltAccum -= need;
        PB.nextR = 0; PB.bulge = 0;
        sim.ev.detaches++;
      }
      // no free slot: hold the bulge; releases resume when traffic returns
    }
  } else {
    PB.bulge = Math.max(PB.bulge - dt / 0.4, 0);
  }

  // ---- top pool: cools toward the dome; drips pendants when cold + full ----
  PT.T = clamp(PT.T + S.kTopPoolCool * (S.TambTop - PT.T) * dt, 0, 1);
  const TCross = 0.483;
  if (PT.pendant === 0 && PT.T < TCross && PT.V > S.pendantVmin) {
    const r = sampleR(sim, S, PT.V);
    if (r >= S.rMin) {
      PT.nextR = r;
      PT.pendantLayer = Math.floor(sim.rng() * S.layerZ.length);
      PT.pendantZ = S.layerZ[PT.pendantLayer] + (sim.rng() * 2 - 1) * S.layerJitter;
      const t3 = C.topPool[Math.floor(sim.rng() * C.topPool.length)];
      PT.pendantX = t3[1] + (sim.rng() * 2 - 1) * 0.03;
      PT.pendant = 1e-4;   // start extruding
    }
  }
  if (PT.pendant > 0 && PT.nextR > 0) {
    PT.pendant = Math.min(PT.pendant + dt / S.tPendant, 1);
    if (PT.pendant >= 1) {
      const slot = bl.find(b => !b.active);
      if (slot) {
        spawnInto(slot, C, sim.rng, 0.90 - PT.nextR * 2.0);
        slot.layer = PT.pendantLayer; slot.z = PT.pendantZ;
        setRadius(slot, PT.nextR, C);
        slot.x = clamp(PT.pendantX, -slot.xMax, slot.xMax);
        slot.T = PT.T; slot.aloft = true;    // it is already aloft, may be absorbed below
        slot.vy = -S.jPendant;
        slot.wdot += 0.25 * (2 * Math.PI * S.wobbleHz);
        PT.V -= PT.nextR ** 3;
        PT.nextR = 0; PT.pendant = 0;
        sim.ev.pendants++;
      }
    }
  }

  // ---- free-blob ⇄ pool exchange (both ends melt in incrementally: exact
  // volume transfer, no one-frame pops) ----
  for (const b of bl) {
    if (!b.active || b.state === 2) continue;
    if (b.absorbing) {
      const A = b.absorbing;
      const tau = A.top ? S.tAbsorbTop : S.tAbsorbBottom;
      const dp = Math.min(dt / tau, 1 - A.p);
      A.p += dp;
      const moved = A.v0 * dp;
      const P = A.top ? PT : PB;
      P.T = (P.T * P.V + b.T * moved) / Math.max(P.V + moved, 1e-9);
      P.V += moved;
      b.r = Math.cbrt(Math.max(A.v0 * (1 - A.p), 1e-12));
      b.y += (A.top ? 0.02 : -0.035) * dt / tau;  // drawn into the mass
      if (A.p >= 1) {
        deactivate(b, bl);
        if (A.top) sim.ev.absorbsTop++; else sim.ev.absorbsBottom++;
      }
      continue;
    }
    // top: sustained loitering near the dome → melt into the reservoir (#6)
    const yTop = C.ceilY - 0.03 - b.r * 0.55;
    if (b.y > yTop - S.domeCatch && Math.abs(b.vy) < 0.004) {
      b.domeTimer = (b.domeTimer || 0) + dt;
    } else {
      b.domeTimer = Math.max((b.domeTimer || 0) - dt * 2, 0);
    }
    if (b.domeTimer > S.tauDome) {
      b.absorbing = { v0: b.r ** 3, p: 0, top: true };
      continue;
    }
    // bottom: a cold sinking blob is absorbed at the pool SURFACE (~dome
    // height), before the near-floor reheat zone can flip it buoyant again —
    // otherwise it creeps at the crossover and bounces forever (see README
    // invariant). Coil breaks the film (#25), so it melts in fast.
    if (b.aloft && b.y < S.recycleY && b.vy < -0.0005 && b.T < 0.45) {
      b.absorbing = { v0: b.r ** 3, p: 0, top: false };
    }
  }
}

function deactivate(b, bl) {
  b.active = false;
  b.absorbing = null; b.domeTimer = 0;
  if (b.partner >= 0 && bl[b.partner]) {
    bl[b.partner].state = 0; bl[b.partner].partner = -1;
  }
  b.state = 0; b.partner = -1;
}
/*SIM-END*/

/* L2-lite + uniform upload: velocity stretch, history tails, scenery pools */
function histAt(b, lagS, dt) {
  const n = b.hist.length / 2;
  const back = Math.min(Math.round(lagS / dt), n - 1);
  if (back < 0) return [b.x, b.y];
  const i = (n - 1 - back) * 2;
  return [b.hist[i], b.hist[i + 1]];
}

function updateBlobs(sim, t) {
  let i = 0;
  const put = (x, y, z, r, T, k, stretch, layer) => {
    blobA.set([x, y, z, r], i * 4);
    blobB.set([T, k, stretch, layer], i * 4);
    i++;
  };
  const dt = CONFIG.sim.dt;
  const alpha = sim.alpha ?? 1;  // render interpolation between sim ticks (§8)
  for (const b of sim.blobs) {
    if (!b.active) {  // parked far outside the vessel; SDF contribution ~0
      for (let k = 0; k <= CONFIG.tailRadii.length; k++) put(0, -9, 0, 1e-3, 0, 0.02, 1, 0);
      continue;
    }
    let stretch = 1 + CONFIG.stretchMax *
      Math.min(Math.abs(b.vy) / CONFIG.stretchVref, 1);
    stretch *= 1 + CONFIG.sim.wobbleGain * b.w;                 // #9 ring-down
    stretch *= 1 + CONFIG.breatheAmp * Math.sin(t * 0.9 + b.seed * 40); // #23
    stretch = Math.max(stretch, 0.7);
    const sv = stretch * (b.vy >= 0 ? 1 : -1);  // signed: egg leads the travel
    const rx = (b.px ?? b.x) + (b.x - (b.px ?? b.x)) * alpha;
    const ry = (b.py ?? b.y) + (b.y - (b.py ?? b.y)) * alpha;
    put(rx, ry, b.z, b.r, b.T, b.kNow, sv, b.layer);
    // tails collapse into the body as a merge/absorption completes, so the
    // trailing spheres never vanish mid-column in a single frame
    let tailMix = 0;
    if (b.state === 2) tailMix = 1 - Math.max(b.mergeT, 0) / CONFIG.sim.tMerge;
    else if (b.absorbing) tailMix = b.absorbing.p;
    for (let k = 0; k < CONFIG.tailRadii.length; k++) {
      const p = histAt(b, CONFIG.tailLagS[k], dt);
      const tx = p[0] + (rx - p[0]) * tailMix;
      const ty = p[1] + (ry - p[1]) * tailMix;
      put(tx, ty, b.z, b.r * CONFIG.tailRadii[k], b.T, CONFIG.tailK, 1, b.layer);
    }
  }
  // pool sizes track the volume ledgers (#7: pools visibly drain/refill)
  const S = CONFIG.sim, PB = sim.poolB, PT = sim.poolT;
  const bScale = Math.max(Math.cbrt(PB.V / S.poolBRef), S.poolBMinScale);
  for (const [r, x, z, yOff] of CONFIG.pool) {
    // pool breathes almost imperceptibly (#23 preview)
    const y = -0.075 + yOff + 0.006 * Math.sin(t * 0.35 + x * 20);
    put(x, y, z, r * bScale, PB.T, CONFIG.sminK * 1.4, 1, 3);
  }
  // top reservoir grows from nothing as blobs deposit (#6, self-priming)
  const tScale = Math.min(Math.cbrt(PT.V / S.poolTRef), 1.15);
  for (const [r, x, z] of CONFIG.topPool) {
    const y = CONFIG.topPoolY + 0.005 * Math.sin(t * 0.27 + x * 17);
    if (tScale < 0.05) { put(0, -9, 0, 1e-3, 0, 0.02, 1, 0); continue; }
    put(x, y, z, r * tScale, PT.T, CONFIG.sminK * 1.5, 1, 3);
  }
  // pre-release bulge (#5): the pool swells at the release point, then the
  // spawned blob takes over at exactly this position — seamless handoff
  if (PB.bulge > 0.01 && PB.nextR > 0) {
    const br = PB.nextR * (0.35 + 0.65 * PB.bulge);
    const by = S.floorY + 0.01 + PB.bulge * PB.nextR * 0.8;
    put(PB.bulgeX, by, PB.bulgeZ, br, PB.T, CONFIG.sminK * 1.4, 1, 3);
  } else put(0, -9, 0, 1e-3, 0, 0.02, 1, 0);
  // pendant drop (#6): extrudes down from the dome; smin thins the neck and
  // the spawned faller pinches it off (#4, visual-only and free)
  if (PT.pendant > 0 && PT.nextR > 0) {
    const pr = PT.nextR * (0.4 + 0.6 * PT.pendant);
    const py = 0.94 - PT.pendant * PT.nextR * 2.0;
    put(PT.pendantX, py, PT.pendantZ, pr, PT.T, CONFIG.sminK * 1.3, 1, 3);
  } else put(0, -9, 0, 1e-3, 0, 0.02, 1, 0);
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxDPR) * CONFIG.renderScale;
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}
window.addEventListener("resize", resize);

const sim = createSim(CONFIG, 0xC0FFEE);
// §5.5 self-priming: the sim starts truly cold (all wax pooled). Pre-roll so
// the page opens mid-circulation; ?cold=1 shows the real warm-up from zero.
if (!qs.has("cold")) {
  const preSteps = Math.round(CONFIG.sim.warmStart / CONFIG.sim.dt);
  for (let i = 0; i < preSteps; i++) simStep(sim, CONFIG);
}
/* ---- §7 interaction: pointer → lamp space, writes sim.touch (L1 only) ---- */
let uiMode = 1;   // 1 = warm touch, -1 = cool; toggle button or right-button
let shake = 0;
let pressed = false, downT = 0, downX = 0, downY = 0;
let lastPX = 0, lastPY = 0, lastPT = 0;

function pointerToLamp(e) {
  const rect = canvas.getBoundingClientRect();
  const ux = (2 * (e.clientX - rect.left) - rect.width) / rect.height;
  const uy = (rect.height - 2 * (e.clientY - rect.top)) / rect.height;
  // mirror the shader camera, sway ignored — approximation is fine (§7)
  const ro = CONFIG.camPos, ta = CONFIG.camTarget;
  let f = [ta[0] - ro[0], ta[1] - ro[1], ta[2] - ro[2]];
  const fl = Math.hypot(...f); f = f.map(v => v / fl);
  let r = [f[2], 0, -f[0]];   // cross(f, up) for up=(0,1,0), normalized below
  const rl = Math.hypot(...r); r = r.map(v => v / rl);
  const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
  const rd = [
    f[0] * CONFIG.camFocal + r[0] * ux + u[0] * uy,
    f[1] * CONFIG.camFocal + r[1] * ux + u[1] * uy,
    f[2] * CONFIG.camFocal + r[2] * ux + u[2] * uy,
  ];
  const tt = -ro[2] / rd[2];  // intersect the lamp mid-plane z = 0
  return [ro[0] + rd[0] * tt, ro[1] + rd[1] * tt];
}

canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("pointerdown", (e) => {
  const [x, y] = pointerToLamp(e);
  pressed = true; downT = performance.now(); downX = x; downY = y;
  sim.touch.active = true; sim.touch.strength = 1;
  sim.touch.mode = e.button === 2 ? -1 : uiMode;
  sim.touch.x = x; sim.touch.y = y;
  lastPX = x; lastPY = y; lastPT = downT;
});
canvas.addEventListener("pointermove", (e) => {
  const [x, y] = pointerToLamp(e);
  const now = performance.now();
  const dts = Math.max((now - lastPT) / 1000, 1e-3);
  // heavily smoothed drag velocity → capped nudge (§7: no grabbing)
  sim.touch.vx = 0.8 * sim.touch.vx + 0.2 * ((x - lastPX) / dts);
  sim.touch.vy = 0.8 * sim.touch.vy + 0.2 * ((y - lastPY) / dts);
  lastPX = x; lastPY = y; lastPT = now;
  sim.touch.x = x; sim.touch.y = y;
  if (!pressed && e.pointerType === "mouse") {   // desktop hover = gentle warmth
    sim.touch.active = true; sim.touch.strength = 0.5; sim.touch.mode = uiMode;
  }
});
canvas.addEventListener("pointerup", (e) => {
  const [x, y] = pointerToLamp(e);
  const quick = performance.now() - downT < 250;
  const still = Math.hypot(x - downX, y - downY) < 0.02;
  if (quick && still) {           // #24 tap the glass
    applyTap(sim, CONFIG, x, y);
    shake = 1;
  }
  pressed = false;
  sim.touch.strength = 0.5;
  if (e.pointerType !== "mouse") sim.touch.active = false;
});
canvas.addEventListener("pointerleave", () => { sim.touch.active = false; pressed = false; });

const modeBtn = document.getElementById("mode");
modeBtn.addEventListener("click", () => {
  uiMode = -uiMode;
  modeBtn.textContent = uiMode > 0 ? "♨" : "❄";
  modeBtn.title = uiMode > 0 ? "touch warms (tap to switch to cool)" : "touch cools (tap to switch to warm)";
});

let acc = 0;
let last = performance.now();
function frame(now) {
  resize();
  // fixed-step sim, wall-clock decoupled by timeScale (§8); clamp the
  // accumulator so a background tab doesn't spiral catching up
  acc += Math.min((now - last) / 1000, 0.25) * CONFIG.timeScale;
  last = now;
  const maxSteps = 600;
  let steps = Math.min(Math.floor(acc / CONFIG.sim.dt), maxSteps);
  acc = Math.min(acc - steps * CONFIG.sim.dt, CONFIG.sim.dt);
  while (steps-- > 0) simStep(sim, CONFIG);
  sim.alpha = acc / CONFIG.sim.dt;

  // drag-velocity and shudder decay in wall time
  sim.touch.vx *= 0.92; sim.touch.vy *= 0.92;
  shake *= Math.exp(-((now - last + 16) / 1000) * 5);

  updateBlobs(sim, sim.t);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, sim.t);
  gl.uniform1f(uShake, shake * 0.005 * Math.sin(now * 0.055));
  gl.uniform4fv(uBlobA, blobA);
  gl.uniform4fv(uBlobB, blobB);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame); // rAF self-throttles when tab is hidden (§8)
}
requestAnimationFrame(frame);
</script>
</body>
</html>
