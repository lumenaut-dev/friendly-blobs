name: Deploy to GitHub Pages

# The site serves from the gh-pages branch (legacy Pages build). Every push
# to a dev branch mirrors the tree to gh-pages, which triggers the Pages
# build automatically. We deploy this way instead of actions/deploy-pages
# because the github-pages environment was auto-pinned to gh-pages when the
# site was created, and GITHUB_TOKEN cannot edit environment policies.

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror to gh-pages
        run: git push --force origin HEAD:gh-pages
